[project]
name = "pixel-display"
version = "0.1.0"
description = "API server for controlling an RGB LED matrix display on Raspberry Pi"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "spotipy>=2.26",
    "Pillow>=12.3",
    "requests>=2.34",
    "setuptools>=84.0",
    "numpy>=2.3",
    "sgp4>=2.27",
]

[tool.uv]
# The server runs as root with PYTHONDONTWRITEBYTECODE, so compile the installed
# packages at sync time (as the normal user) instead of on every display start.
# (Only site-packages; the project's own few modules still compile at startup.)
compile-bytecode = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the in-place rgbmatrix bindings so the editable install puts
# bindings/python on sys.path (hatchling's heuristics no longer find it).
[tool.hatch.build.targets.wheel]
packages = ["bindings/python/rgbmatrix"]
